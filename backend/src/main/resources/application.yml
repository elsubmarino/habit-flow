spring:
  datasource:
    url: jdbc:mariadb://localhost:3307/habitflow
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
jwt:
  secret: habitflowsecretkeywhichisverylongandsecureenoughforhs256algorithm2026