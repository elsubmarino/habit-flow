spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
  error:
    include-stacktrace: never
jwt:
  secret: ${JWT_KEY}
hashids:
  salt: ${HASHIDS_SALT}
  min-length: 8
app:
  frontend-base-url: ${FRONTEND_BASE_URL}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
file:
  upload:
    dir: ${FILE_UPLOAD_DIR:/var/habitflow/uploads}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true