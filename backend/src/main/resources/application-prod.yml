spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
  datasource:
    url: jdbc:mariadb://localhost:3307/habitflow
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 500
    redis:
      host: 127.0.0.1
      port: 6379

jwt:
  secret: ${JWT_KEY}
file:
  upload:
    dir: ./uploads
decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
springdoc:
  packages-to-scan: io.streak.habitflow.domain
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha