name: habit-flow

services:
  redis:
    image: redis:7-alpine
    container_name: habit-flow-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  db:
    image: mariadb:10.11
    ports: [ "3305:3306" ]   # 로컬 IDE 접근용
    environment:
      MARIADB_DATABASE: habitflow
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
  backend:
    build:
      context: ./backend
    container_name: habit-flow-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mariadb://db:3306/habitflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Seoul
    depends_on: [db, redis]
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: habit-flow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data: